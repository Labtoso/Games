name: Refresh guessing pool

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Pool size to aim for"
        default: "3300"
  push:
    branches: ["main"]
    paths:
      - "tools/guess-pipeline/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "guess-pool"
  cancel-in-progress: false

jobs:
  # 8 runners collect new sites in parallel, each from its own slice of the Tranco list
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout current pool
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pool
          path: old-pool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: tools/guess-pipeline
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Fetch domain lists
        working-directory: tools/guess-pipeline
        run: |
          mkdir -p lists
          curl -sSfL -o lists/tranco.zip https://tranco-list.eu/top-1m.csv.zip
          unzip -o -q lists/tranco.zip -d lists
          curl -sSfL -o lists/block.txt https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
          curl -sSfL -o lists/urlhaus.txt https://urlhaus.abuse.ch/downloads/hostfile/ || true
      - name: Collect sites
        working-directory: tools/guess-pipeline
        run: node build.mjs --old ../../old-pool --out ../../part --target "${{ github.event.inputs.target || '3300' }}" --part ${{ matrix.part }} --parts 8 --minutes 170
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: part
          retention-days: 2

  build:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout current pool
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pool
          path: old-pool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: tools/guess-pipeline
        run: npm install --no-audit --no-fund
      - name: Fetch block lists
        working-directory: tools/guess-pipeline
        run: |
          mkdir -p lists
          curl -sSfL -o lists/block.txt https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
          curl -sSfL -o lists/urlhaus.txt https://urlhaus.abuse.ch/downloads/hostfile/ || true
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Merge pool
        working-directory: tools/guess-pipeline
        run: node build.mjs --old ../../old-pool --out ../../new-pool --target "${{ github.event.inputs.target || '3300' }}" --merge "$(ls -d ../../parts/part-* | paste -sd, -)"
      - name: Publish pool branch
        run: |
          cd new-pool
          git init -q -b pool
          git config user.name "Labtoso"
          git config user.email "235880825+Labtoso@users.noreply.github.com"
          git add -A
          git commit -q -m "pool: refresh $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pool
  deploy:
    needs: build
    uses: ./.github/workflows/static.yml
