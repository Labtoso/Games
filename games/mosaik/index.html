<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaic · games.labtoso.de</title>
<meta name="description" content="A logic puzzle of numbered tiles that turns into a picture.">
<meta name="theme-color" content="#131116">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
</head>
<body class="game-page" data-game="mosaik">
<header class="bar">
  <a class="back" href="../../">← Arcade</a>
  <h1>Mosaic</h1>
  <button class="mute" type="button" data-mute>Sound on</button>
  <div class="scores"><span>Score <b data-score>0</b></span><span>Best <b data-best>0</b></span></div>
</header>
<main class="stage">
  <canvas id="c" aria-label="Mosaic"></canvas>
  <div class="overlay" hidden><div class="card"><h2></h2><p></p><button class="btn" type="button"></button></div></div>
</main>
<footer class="hint"><span>Tap to glaze, tap again to mark empty, drag to fill.</span><span class="keys"><kbd>H</kbd> hint · <kbd>M</kbd> mode · right click marks empty</span></footer>
<script src="../../shared/shell.js"></script>
<script src="game.js"></script>
</body>
</html>
