<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starwatch · games.labtoso.de</title>
<meta name="description" content="A space shooter with a workshop full of upgrades.">
<meta name="theme-color" content="#f2ecdf">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
</head>
<body class="game-page" data-game="sternwacht">
<header class="bar">
  <a class="back" href="../../">← Arcade</a>
  <h1>Starwatch</h1>
  <button class="mute" type="button" data-shop>Shop</button>
  <button class="mute" type="button" data-mute>Sound on</button>
  <div class="scores"><span>Score <b data-score>0</b></span><span>Best <b data-best>0</b></span></div>
</header>
<main class="stage">
  <canvas id="c" aria-label="Starwatch"></canvas>
  <div class="overlay" hidden><div class="card"><h2></h2><p></p><button class="btn" type="button"></button></div></div>
</main>
<footer class="hint"><span>Drag to fly. Bomb and shop buttons sit bottom right.</span><span class="keys"><kbd>WASD</kbd>/<kbd>arrows</kbd> fly · <kbd>Shift</kbd> slow · <kbd>X</kbd> bomb · <kbd>B</kbd>/<kbd>Space</kbd> shop</span></footer>
<script src="../../shared/shell.js"></script>
<script src="game.js"></script>
</body>
</html>
